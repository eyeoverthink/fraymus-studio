<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FRAYMUS | Brain Sandbox: Trust Tuning</title>
    <style>
        :root { --bg: #0a0a0a; --accent: #fc0; --cyan: #9fe; --font: 'Courier New', Courier, monospace; }
        body { background: var(--bg); color: var(--cyan); font-family: var(--font); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        h1 { color: var(--accent); text-transform: uppercase; border-bottom: 1px solid var(--cyan); }
        .panel { border: 1px solid var(--cyan); padding: 15px; margin-bottom: 20px; background: #111; }
        input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
        .ladder-ticks { display: flex; justify-content: space-between; font-size: 10px; margin-top: 5px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 10px; }
        .cell { height: 20px; background: #222; border: 1px solid #444; }
        .active { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .controls { display: flex; gap: 10px; margin-top: 10px; }
        button { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 5px 10px; cursor: pointer; }
        button:hover { background: var(--accent); color: var(--bg); }
        canvas { width: 100%; height: 150px; border: 1px solid #333; margin-top: 10px; }
        .table-view { display: none; margin-top: 10px; border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #444; padding: 5px; text-align: left; }
    </style>
</head>
<body>
<div class="container">
    <h1>FRAYMUS Brain Sandbox: Trust Tuner</h1>
    <div class="panel">
        <label>Pattern Trust Cap: <span id="valDisplay">0.50</span></label>
        <input type="range" id="trustSlider" min="0" max="1" step="0.01" value="0.50">
        <div class="ladder-ticks"><span>0.15</span><span>0.35</span><span>0.55</span><span>0.70</span><span>0.85</span></div>
    </div>
    <div class="panel">
        <h3>Live Neuron Activity</h3>
        <div id="brainGrid" class="grid"></div>
        <div style="margin-top:10px">
            <div>Wet (Rain): <span id="outWet">0.000</span></div>
            <div>Move Hand: <span id="outHand">0.000</span></div>
            <div>Had (Mary): <span id="outHad">0.000</span></div>
        </div>
    </div>
    <canvas id="chart"></canvas>
    <div class="controls">
        <button onclick="toggleTable()">Toggle Trust Table</button>
        <button onclick="runPassive()">Run 50 Passive Steps</button>
        <button onclick="exportJSONL()">Export JSONL</button>
    </div>
    <table id="trustTable" class="table-view">
        <tr><th>Input</th><th>Net-Only (0.30)</th><th>Trust-On (0.85)</th></tr>
        <tr><td>Rain</td><td>0.412</td><td>0.941</td></tr>
        <tr><td>Fire/Hand</td><td>0.220</td><td>0.780</td></tr>
        <tr><td>Mary/Little</td><td>0.310</td><td>0.890</td></tr>
    </table>
</div>
<script>
    const slider = document.getElementById('trustSlider');
    const valDisplay = document.getElementById('valDisplay');
    const brainGrid = document.getElementById('brainGrid');
    const chart = document.getElementById('chart');
    const ctx = chart.getContext('2d');
    for(let i=0; i<12; i++) { const div = document.createElement('div'); div.className = 'cell'; brainGrid.appendChild(div); }
    let history = [];
    function update() {
        const trust = parseFloat(slider.value);
        valDisplay.textContent = trust.toFixed(2);
        const wet = Math.min(1.0, trust * 1.7);
        const hand = Math.min(1.0, trust * 1.3);
        const had = Math.min(1.0, trust * 1.5);
        document.getElementById('outWet').textContent = wet.toFixed(3);
        document.getElementById('outHand').textContent = hand.toFixed(3);
        document.getElementById('outHad').textContent = had.toFixed(3);
        document.querySelectorAll('.cell').forEach((el, i) => { el.classList.toggle('active', (i / 12) < trust); });
        history.push(wet); if(history.length > 50) history.shift(); drawChart();
    }
    function drawChart() {
        ctx.clearRect(0,0,chart.width,chart.height);
        ctx.strokeStyle = '#9fe'; ctx.beginPath();
        history.forEach((h, i) => { ctx.lineTo((i/50)*chart.width, chart.height - (h * chart.height)); });
        ctx.stroke();
    }
    function toggleTable() { const t = document.getElementById('trustTable'); t.style.display = t.style.display === 'table' ? 'none' : 'table'; }
    function runPassive() {
        let val = parseFloat(slider.value);
        const interval = setInterval(() => {
            val = Math.min(1.0, val + 0.01); slider.value = val; update();
            if(val >= 0.99) clearInterval(interval);
        }, 50);
    }
    function exportJSONL() { const state = { trust: slider.value, timestamp: Date.now() }; alert("Exporting State: " + JSON.stringify(state)); }
    slider.addEventListener('input', update); update();
</script>
</body>
</html>
